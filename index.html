<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHHAYANSH</title>
<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
}
body {
    background: #000;
    color: #fff2c2;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: Arial, sans-serif;
}
main {
    text-align: center;
}
.crown {
    font-size: clamp(50px, 8vw, 100px);
    color: #ffd54a;
    text-shadow: 0 0 15px #ff9900, 0 0 35px #ff6600;
    animation: float 2s ease-in-out infinite;
    margin-bottom: 10px;
}
.name {
    font-size: clamp(55px, 10vw, 150px);
    font-weight: 900;
    letter-spacing: 0.08em;
    color: #fff8dc;
    -webkit-text-stroke: 2px #ffbe32;
    text-shadow:
        0 0 10px #ffd54a,
        0 0 25px #ff9900,
        0 0 55px #ff6600;
    animation: glow 2s ease-in-out infinite alternate;
}
@keyframes glow {
    from {
        transform: scale(1);
        text-shadow: 0 0 10px #ffd54a, 0 0 25px #ff9900, 0 0 45px #ff6600;
    }
    to {
        transform: scale(1.02);
        text-shadow: 0 0 18px #fff0a0, 0 0 35px #ffb300, 0 0 70px #ff6600;
    }
}
@keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
}
</style>
</head>
<body>
<main>
    <div class="crown">♛</div>
    <div class="name">CHHAYANSH</div>
</main>
</body>
</html>
